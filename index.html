<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 🌻</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: #fff;
            text-align: center;
        }
        #intro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 85%;
            max-width: 400px;
            padding: 30px;
            background: rgba(20, 15, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            transition: opacity 1s ease;
        }
        h1 {
            font-size: 1.6rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }
        p {
            font-size: 1rem;
            color: #eee;
            margin-bottom: 25px;
        }
        button {
            background-color: #ffd700;
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        /* အလယ်က ကြီးမားတဲ့ ပန်းပွင့်ပုံစံ */
        #center-flower {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            z-index: 2;
            display: none;
            animation: pulse 2s infinite;
            pointer-events: none;
            text-shadow: 0 0 20px #ffd700;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .floating-text {
            position: absolute;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
            white-space: nowrap;
            animation: floatUp 6s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="intro">
        <h1>Feliz día de las Flores Amarillas 🌻</h1>
        <p>Una galaxia llena de amor para ti</p>
        <button onclick="startExperience()">Abrir Universo ❤️</button>
    </div>

    <div id="center-flower">🌻</div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const messages = [
            "Flores para ti 🌻", "Mi flor favorita ❤️", "Eres luz en mi vida ✨", 
            "Siempre brillতার 💛", "Un detalle amarillo 🌻", "Feliz día ✨", "Te amo ❤️"
        ];

        function startExperience() {
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                document.getElementById('center-flower').style.display = 'block';
                document.getElementById('canvas-container').style.display = 'block';
                initGalaxy();
                startFloatingTexts();
            }, 1000);
        }

        function initGalaxy() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            const particlesCount = 9000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);

            const colorYellow = new THREE.Color(0xffd700);

            for (let i = 0; i < particlesCount; i++) {
                const radius = Math.random() * 25 + 2;
                const spinAngle = radius * 0.4;
                const branchAngle = ((i % 4) * 2 * Math.PI) / 4;
                const angle = branchAngle + spinAngle;

                const x = Math.cos(angle) * radius;
                const y = (Math.random() - 0.5) * 3;
                const z = Math.sin(angle) * radius;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                colors[i * 3] = colorYellow.r;
                colors[i * 3 + 1] = colorYellow.g;
                colors[i * 3 + 2] = colorYellow.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.9
            });

            const galaxyParticles = new THREE.Points(geometry, material);
            scene.add(galaxyParticles);

            camera.position.set(0, 15, 25);
            camera.lookAt(0, 0, 0);

            function animate() {
                requestAnimationFrame(animate);
                galaxyParticles.rotation.y += 0.003;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function startFloatingTexts() {
            setInterval(() => {
                const textDiv = document.createElement('div');
                textDiv.className = 'floating-text';
                textDiv.innerText = messages[Math.floor(Math.random() * messages.length)];
                textDiv.style.left = Math.random() * 80 + 10 + 'vw';
                textDiv.style.animationDuration = (Math.random() * 3 + 4) + 's';
                document.body.appendChild(textDiv);

                setTimeout(() => {
                    textDiv.remove();
                }, 6000);
            }, 500);
        }
    </script>
</body>
</html>
