<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas 🌻</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #ffd700; text-align: center; font-family: sans-serif; }
        #box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; }
        button { background: #ffd700; color: #000; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; }
        #webgl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    </style>
</head>
<body>
    <div id="box">
        <h1>Feliz día de las Flores Amarillas 🌻</h1>
        <br>
        <button onclick="go()">နှိပ်ပါ ❤️</button>
    </div>
    <div id="webgl"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        function go() {
            document.getElementById('box').style.display = 'none';
            document.getElementById('webgl').style.display = 'block';

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('webgl').appendChild(renderer.domElement);

            const count = 5000;
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);

            for(let i=0; i<count*3; i+=3) {
                const r = Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                pos[i] = Math.cos(theta) * r;
                pos[i+1] = (Math.random() - 0.5) * 2;
                pos[i+2] = Math.sin(theta) * r;
            }
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({size: 0.15, color: 0xffd700});
            const points = new THREE.Points(geom, mat);
            scene.add(points);
            camera.position.z = 20;

            function animate() {
                requestAnimationFrame(animate);
                points.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
